<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Durable Object Counter</title>
	<style>
		:root {
			color-scheme: light dark;
			font-family: system-ui, sans-serif;
		}
		body {
			display: grid;
			place-items: center;
			min-height: 100vh;
			margin: 0;
			padding-inline: 16px;
			text-align: center;
		}
		#count {
			font-size: 5rem;
			font-variant-numeric: tabular-nums;
			margin: 0.5rem 0 1.5rem;
		}
		button,
		input {
			font: inherit;
			padding: 0.6rem 1rem;
		}
		button {
			cursor: pointer;
		}
		form {
			display: flex;
			gap: 0.5rem;
			margin-top: 2rem;
		}
		input {
			flex: 1;
			min-width: 0;
		}
	</style>
</head>
<body>
	<main>
		<h1>Shared counter</h1>
		<p id="count">…</p>
		<button id="increment">Increment</button>

		<form id="text-form">
			<input id="text" placeholder="Shared text" />
			<button>Save</button>
		</form>

		<p>WebSocket: <span id="status">connecting…</span></p>
	</main>

	<script>
		const countEl = document.getElementById("count");
		const textEl = document.getElementById("text");
		const statusEl = document.getElementById("status");

		// 1. Fetch the initial values once.
		fetch("/count")
			.then((response) => response.json())
			.then(({ count }) => (countEl.textContent = count));
		fetch("/text")
			.then((response) => response.json())
			.then(({ text }) => (textEl.value = text));

		// 2. Open a WebSocket; the Durable Object pushes { count } or { text } on every change.
		const wsUrl = new URL("/websocket", location.href);
		wsUrl.protocol = location.protocol === "https:" ? "wss:" : "ws:";
		const ws = new WebSocket(wsUrl);

		ws.addEventListener("open", () => (statusEl.textContent = "connected"));
		ws.addEventListener("close", () => (statusEl.textContent = "disconnected"));
		ws.addEventListener("message", (event) => {
			const data = JSON.parse(event.data);
			if ("count" in data) countEl.textContent = data.count;
			if ("text" in data) textEl.value = data.text;
		});

		// 3. Write over HTTP. The new values arrive via the WebSocket.
		document.getElementById("increment").addEventListener("click", () => {
			fetch("/increment", { method: "POST" });
		});
		document.getElementById("text-form").addEventListener("submit", (event) => {
			event.preventDefault();
			fetch("/text", { method: "PUT", body: JSON.stringify({ text: textEl.value }) });
		});
	</script>
</body>
</html>
