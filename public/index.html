<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Durable Object Counter</title>
	<style>
		:root {
			color-scheme: light dark;
			font-family: system-ui, sans-serif;
		}
		body {
			display: grid;
			place-items: center;
			min-height: 100vh;
			margin: 0;
			text-align: center;
		}
		#count {
			font-size: 5rem;
			font-variant-numeric: tabular-nums;
			margin: 0.5rem 0 1.5rem;
		}
		button {
			font: inherit;
			padding: 0.6rem 1.4rem;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<main>
		<h1>Shared counter</h1>
		<p id="count">…</p>
		<button id="increment">Increment</button>
		<p>WebSocket: <span id="status">connecting…</span></p>
	</main>

	<script>
		const countEl = document.getElementById("count");
		const statusEl = document.getElementById("status");
		const button = document.getElementById("increment");

		// 1. Fetch the initial count once.
		fetch("/count")
			.then((response) => response.json())
			.then(({ count }) => (countEl.textContent = count));

		// 2. Open a WebSocket; the Durable Object pushes { count } on every increment.
		const wsUrl = new URL("/websocket", location.href);
		wsUrl.protocol = location.protocol === "https:" ? "wss:" : "ws:";
		const ws = new WebSocket(wsUrl);

		ws.addEventListener("open", () => (statusEl.textContent = "connected"));
		ws.addEventListener("close", () => (statusEl.textContent = "disconnected"));
		ws.addEventListener("message", (event) => {
			countEl.textContent = JSON.parse(event.data).count;
		});

		// 3. Increment over HTTP. The new count arrives via the WebSocket.
		button.addEventListener("click", () => fetch("/increment", { method: "POST" }));
	</script>
</body>
</html>
